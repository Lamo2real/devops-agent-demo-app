<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Starfall Dodge</title>
  <meta name="description" content="Dodge the meteors, collect the crystals, climb the leaderboard.">
  <style>
    :root { color-scheme: dark; --bg: #070b1a; --panel: rgba(10, 16, 40, .88); --text: #e8ecff; --muted: #9aa6d6; --accent: #5ee7ff; --warn: #ff8f6b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
    main { position: relative; width: min(100%, 480px, calc((100dvh - 16px) * 2 / 3)); aspect-ratio: 2 / 3; }
    canvas { width: 100%; height: 100%; display: block; border-radius: 14px; background: #0a1030; touch-action: none; box-shadow: 0 8px 40px rgba(0, 0, 0, .5); }
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; border-radius: 14px; background: rgba(5, 8, 22, .55); }
    #overlay[hidden] { display: none; }
    .card { width: 100%; max-height: 100%; overflow: auto; padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(94, 231, 255, .25); text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: .02em; }
    .tag { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
    #message { min-height: 1.4em; margin: 6px 0 10px; }
    #message.error { color: var(--warn); }
    button, input { font: inherit; border-radius: 10px; border: 1px solid rgba(94, 231, 255, .4); background: #0d1740; color: var(--text); padding: 10px 14px; }
    button { cursor: pointer; background: linear-gradient(180deg, #1c6dff, #1349c9); border-color: transparent; font-weight: 600; min-width: 8rem; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #scoreForm { display: flex; gap: 8px; justify-content: center; margin: 8px 0; flex-wrap: wrap; }
    #scoreForm[hidden] { display: none; }
    #name { width: 11rem; }
    ol { list-style: none; margin: 12px 0 0; padding: 0; text-align: left; font-variant-numeric: tabular-nums; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 8px; border-radius: 6px; }
    li:nth-child(odd) { background: rgba(255, 255, 255, .04); }
    li.me { outline: 1px solid var(--accent); }
    .hint { margin-top: 10px; color: var(--muted); font-size: .85rem; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main>
    <canvas id="game" role="img" aria-label="Starfall Dodge game board. Use the left and right arrow keys, or drag, to move the ship."></canvas>
    <div id="overlay">
      <div class="card">
        <h1>Starfall Dodge</h1>
        <p class="tag">Dodge the meteors. Catch the crystals.</p>
        <p id="message" role="status" aria-live="polite"></p>
        <form id="scoreForm" hidden>
          <label class="sr" for="name" style="position:absolute;left:-9999px">Your name</label>
          <input id="name" name="name" maxlength="16" autocomplete="nickname" placeholder="Your name" required>
          <button id="submit" type="submit">Submit score</button>
        </form>
        <button id="play" type="button">Play</button>
        <ol id="board" aria-label="Leaderboard"></ol>
        <p class="hint">Arrow keys or A / D to move. On a phone, drag.</p>
      </div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
