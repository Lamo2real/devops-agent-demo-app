name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    # The deploy role trusts only this GitHub environment, limited to main.
    environment: ${{ vars.ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: Tests
        run: make test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          APP_VERSION: ${{ github.sha }}
          AUTO_APPROVE: "1"
        run: scripts/terraform.sh apply
      - name: API URL
        id: api
        run: echo "url=$(terraform -chdir=terraform/main output -raw api_url)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          API_URL: ${{ steps.api.outputs.url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          origin="https://$(tr '[:upper:]' '[:lower:]' <<< "$OWNER").github.io"
          python3 scripts/smoke_test.py "$API_URL" "${{ github.sha }}" "$origin"

  pages:
    name: Publish the game on GitHub Pages
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the game at the deployed API
        env:
          API_URL: ${{ needs.deploy.outputs.api_url }}
        run: |
          printf 'window.STARFALL_CONFIG = { apiUrl: "%s" };\n' "$API_URL" > web/config.js
          cat web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
